[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-data-ingestion"
version = "0.1.0"
description = "In-memory DICOM ingestion and validation pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "pydicom>=3.0.0",
    "pydantic>=2.14.0",
    "python-multipart>=0.0.32",
    "numpy>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "httpx>=0.28.0",
    "mypy>=2.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
